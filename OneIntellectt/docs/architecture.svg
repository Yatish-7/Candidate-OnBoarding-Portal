<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="Segoe UI, Inter, Arial, sans-serif">
  <title>One Intellectt — system architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .layer { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.2; }
      .sec { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.2; }
      .db { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .wf { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 1.2; }
      .h1 { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .h2 { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .h3 { font-size: 13px; font-weight: 600; fill: #1e293b; }
      .t { font-size: 12px; fill: #334155; }
      .s { font-size: 11px; fill: #64748b; }
      .lbl { font-size: 11px; fill: #1e293b; font-weight: 600; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dline { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1240" height="880" fill="#ffffff"/>
  <text x="40" y="44" class="h1">One Intellectt — System Architecture</text>
  <text x="40" y="66" class="s">Candidate Onboarding &amp; Approval Portal · React SPA + Spring Boot REST API + PostgreSQL</text>

  <!-- Users -->
  <rect x="40" y="100" width="220" height="296" rx="12" class="group"/>
  <text x="58" y="126" class="h2">Users (browser)</text>
  <g class="t">
    <text x="58" y="150">Recruiter</text>
    <text x="58" y="168">Sales Lead · Sales Manager</text>
    <text x="58" y="186">HR · Contracts</text>
    <text x="58" y="204">Payroll · Accounts</text>
    <text x="58" y="222">Admin</text>
    <text x="58" y="240">Super Admin</text>
  </g>
  <rect x="58" y="258" width="184" height="62" rx="8" class="box"/>
  <text x="70" y="280" class="h3">Frontend SPA</text>
  <text x="70" y="298" class="s">React 19 · Vite 8 · Ant Design 6</text>
  <text x="70" y="312" class="s">served as static files (dist/)</text>
  <text x="58" y="346" class="s">Role decides the menu and buttons;</text>
  <text x="58" y="361" class="s">the server re-checks every request.</text>
  <text x="58" y="380" class="s">Only company email domains sign in.</text>

  <!-- nginx -->
  <rect x="310" y="190" width="150" height="110" rx="10" class="box"/>
  <text x="324" y="214" class="h3">nginx (production)</text>
  <text x="324" y="234" class="s">HTTPS / TLS</text>
  <text x="324" y="250" class="s">security headers</text>
  <text x="324" y="266" class="s">serves dist/</text>
  <text x="324" y="282" class="s">proxies /api → :5000</text>

  <path d="M260 245 L308 245" class="line"/>
  <text x="262" y="236" class="lbl">HTTPS</text>

  <!-- Backend -->
  <rect x="510" y="100" width="440" height="560" rx="12" class="group"/>
  <text x="528" y="126" class="h2">Backend REST API — Spring Boot 4.1 · Java 17 · :5000</text>

  <rect x="528" y="140" width="404" height="62" rx="8" class="layer"/>
  <text x="540" y="160" class="h3">Security filter chain</text>
  <text x="540" y="178" class="s">CORS · CSP &amp; headers · JwtAuthFilter (token → live session → user)</text>
  <text x="540" y="193" class="s">idle timeout · one session per user · forced password change</text>

  <rect x="528" y="212" width="404" height="70" rx="8" class="layer"/>
  <text x="540" y="232" class="h3">Controllers  /api/…</text>
  <text x="540" y="250" class="s">auth (login, /me) · users · teams (+ /options, manager)</text>
  <text x="540" y="266" class="s">candidates · audit   →  GlobalExceptionHandler</text>

  <rect x="528" y="292" width="404" height="128" rx="8" class="layer"/>
  <text x="540" y="312" class="h3">Services (business rules &amp; authorization)</text>
  <text x="540" y="332" class="s">CandidateService — workflow state machine, visibility, rate change,</text>
  <text x="540" y="347" class="s">project end date, intake checks, HTML emails</text>
  <text x="540" y="365" class="s">AuthService · SessionService · UserService · TeamService</text>
  <text x="540" y="381" class="s">AuditService (reads *_aud) · EmailService (entity routing)</text>
  <text x="540" y="397" class="s">CandidateQueries — paging, search, status filter, visibility in SQL</text>
  <text x="540" y="412" class="s">Lead / Manager / Super Admin / team checks live here</text>

  <rect x="528" y="430" width="404" height="62" rx="8" class="layer"/>
  <text x="540" y="450" class="h3">Persistence</text>
  <text x="540" y="468" class="s">Spring Data JPA · Hibernate 7 · HikariCP (30)</text>
  <text x="540" y="483" class="s">Hibernate Envers audit on every entity</text>

  <rect x="528" y="504" width="196" height="140" rx="8" class="sec"/>
  <text x="540" y="524" class="h3">Security services</text>
  <text x="540" y="542" class="s">JwtService (HMAC-SHA)</text>
  <text x="540" y="558" class="s">AttemptLimiter (lock-outs)</text>
  <text x="540" y="574" class="s">FieldCipher (AES-256-GCM)</text>
  <text x="540" y="590" class="s">CredentialRules · email domains</text>
  <text x="540" y="606" class="s">SecurityEvents → log</text>
  <text x="540" y="622" class="s">bcrypt passwords</text>

  <rect x="736" y="504" width="196" height="140" rx="8" class="box"/>
  <text x="748" y="524" class="h3">Async mail</text>
  <text x="748" y="542" class="s">mailExecutor: 4–10 threads</text>
  <text x="748" y="558" class="s">queue 5000; full → drop</text>
  <text x="748" y="574" class="s">one email per event, no repeats</text>
  <text x="748" y="592" class="s">hr@ · contracts@ · payroll@</text>
  <text x="748" y="606" class="s">accounts@ · superadmin@ of the</text>
  <text x="748" y="620" class="s">Placement Entity (+ the payroll</text>
  <text x="748" y="634" class="s">company, if different)</text>

  <path d="M460 245 L526 245" class="line"/>
  <text x="464" y="236" class="lbl">JSON/JWT</text>

  <!-- DB -->
  <rect x="1000" y="290" width="200" height="236" rx="12" class="db"/>
  <text x="1016" y="316" class="h2">PostgreSQL 16</text>
  <text x="1016" y="336" class="s">database "Intellectt"</text>
  <text x="1016" y="360" class="t">users · teams (lead, manager)</text>
  <text x="1016" y="378" class="t">candidates (SSN encrypted)</text>
  <text x="1016" y="396" class="t">approval_actions (trail)</text>
  <text x="1016" y="414" class="t">user_sessions</text>
  <text x="1016" y="432" class="t">password_reset_tokens</text>
  <text x="1016" y="456" class="t">*_aud history tables</text>
  <text x="1016" y="474" class="t">audit_revisions</text>
  <text x="1016" y="494" class="s">CHECK constraints: see</text>
  <text x="1016" y="508" class="s">docs/*-migration.sql</text>
  <path d="M934 440 L998 440" class="line"/>
  <text x="940" y="431" class="lbl">JDBC</text>

  <!-- SMTP -->
  <rect x="1000" y="560" width="200" height="84" rx="12" class="box"/>
  <text x="1016" y="586" class="h2">SMTP / email service</text>
  <text x="1016" y="606" class="s">Gmail (dev) · transactional</text>
  <text x="1016" y="622" class="s">service (production)</text>
  <path d="M934 600 L998 598" class="line"/>

  <!-- Secrets & logs -->
  <rect x="510" y="690" width="250" height="84" rx="10" class="sec"/>
  <text x="524" y="714" class="h3">secrets.properties / env vars</text>
  <text x="524" y="734" class="s">DB password · JWT key · SSN key</text>
  <text x="524" y="750" class="s">mail password · first admin password</text>
  <text x="524" y="766" class="s">(never committed)</text>
  <path d="M635 688 L635 662" class="dline"/>

  <rect x="790" y="690" width="210" height="84" rx="10" class="box"/>
  <text x="804" y="714" class="h3">logs/</text>
  <text x="804" y="734" class="s">oneintellectt.log (30 days)</text>
  <text x="804" y="750" class="s">security.log (365 days)</text>
  <text x="804" y="766" class="s">no passwords, no IPs</text>
  <path d="M870 662 L890 688" class="line"/>

  <!-- Workflow -->
  <rect x="40" y="420" width="440" height="440" rx="12" class="wf"/>
  <text x="58" y="446" class="h2">Candidate workflow</text>
  <text x="58" y="472" class="t">1. Recruiter submits (intake form, SSN encrypted)</text>
  <text x="76" y="488" class="s">emails the team's Sales Lead and Sales Manager</text>
  <text x="58" y="510" class="t">2. Sales Lead OR Sales Manager approves (either one)</text>
  <text x="76" y="526" class="s">or declines (comment) → Declined, ends there</text>
  <text x="58" y="548" class="t">3. HR and Contracts review in parallel</text>
  <text x="76" y="564" class="s">decline (comment) → back to the Sales Lead / Manager</text>
  <text x="58" y="586" class="t">4. Both approved → Payroll and Accounts see it</text>
  <text x="76" y="602" class="s">they approve or decline in parallel (comment on decline)</text>
  <text x="58" y="624" class="t">5. All four approved → Awaiting DOJ</text>
  <text x="58" y="646" class="t">6. Sales Lead / Manager approves the DOJ → Joined</text>
  <text x="58" y="668" class="t">7. After joining: recruiter raises a project end date;</text>
  <text x="58" y="686" class="t">Lead / Manager / Super Admin approve it → Exited</text>
  <text x="58" y="708" class="t">Any time: HR edits details; Lead / Manager / SA change rates</text>
  <text x="58" y="722" class="s">(a comment is required for rates; every change is emailed)</text>
  <text x="58" y="742" class="t">Super Admin can override at any stage (final)</text>
  <text x="58" y="758" class="s">Every action: trail entry + audit + email to the Placement</text>
  <text x="58" y="773" class="s">Entity's mailboxes (and the payroll company's, if different)</text>
  <text x="58" y="798" class="s">Visibility: recruiter own · Lead own team · Manager all</text>
  <text x="58" y="813" class="s">their teams · HR/Contracts past Sales Lead · Payroll and</text>
  <text x="58" y="828" class="s">Accounts only after HR and Contracts approve · Admin none</text>
</svg>
