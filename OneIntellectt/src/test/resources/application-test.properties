# ---------------------------------------------------------------------------
# Test profile (@ActiveProfiles("test")): layered over the main
# application.properties. Points at a SEPARATE database so tests never touch
# real data, and makes sure no email can actually be sent.
#
# One-time setup:  CREATE DATABASE intellectt_test;   (tables are auto-created)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/intellectt_test
spring.jpa.show-sql=false

# Unreachable SMTP: any send fails instantly, nothing leaves the machine
spring.mail.host=localhost
spring.mail.port=1
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
# ...and don't fill the test output with those expected send failures
logging.level.com.intellectt.service.EmailServiceImpl=OFF

# The seeded Super Admin the tests sign in as (the real config uses another address)
app.superadmin.email=admin@intellectt.com

# The tests create users at test.local; the seeded admin is at intellectt.com
app.allowed-email-domains=test.local,intellectt.com
