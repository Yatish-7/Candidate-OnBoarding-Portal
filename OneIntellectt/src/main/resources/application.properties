
spring.application.name=OneIntellectt

server.port=${PORT:5000}

# Secrets: use environment variables in production.
# Local development may use OneIntellectt/secrets.properties.
spring.config.import=optional:file:./secrets.properties

# Reverse proxy headers
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------------
# PostgreSQL / Supabase
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Intellectt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool: keep small for free hosting and shared database resources.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# Production schema has already been migrated to Supabase.
# Validate the schema without changing it.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Hibernate Envers audit configuration
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# ---------------------------------------------------------------------------
# JWT configuration
# ---------------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Encryption key for candidate SSNs and other protected fields
app.crypto.key=${APP_CRYPTO_KEY:}

# ---------------------------------------------------------------------------
# Sessions
# ---------------------------------------------------------------------------
app.session.idle-timeout-minutes=${SESSION_IDLE_TIMEOUT_MINUTES:30}

# ---------------------------------------------------------------------------
# CORS: comma-separated frontend origins
# Local development defaults are retained.
# Set CORS_ALLOWED_ORIGINS in Render after deploying the frontend.
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ---------------------------------------------------------------------------
# Password reset
# Set APP_FRONTEND_BASE_URL to the deployed Vercel URL.
# ---------------------------------------------------------------------------
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.reset.token-ttl-minutes=${RESET_TOKEN_TTL_MINUTES:60}

# ---------------------------------------------------------------------------
# Initial Super Admin
# Configure SUPERADMIN_PASSWORD securely in the deployment environment.
# ---------------------------------------------------------------------------
app.superadmin.name=Super Admin
app.superadmin.email=${SUPERADMIN_EMAIL:admin@intellectt.com}
app.superadmin.password=${SUPERADMIN_PASSWORD:}

# ---------------------------------------------------------------------------
# Email / SMTP
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

app.mail.from=${MAIL_FROM:${spring.mail.username}}

# ---------------------------------------------------------------------------
# Entity-based email routing
# ---------------------------------------------------------------------------
app.entity-mail.domains.novozen=novozen.com
app.entity-mail.domains.revereit=revereit.com
app.entity-mail.domains.premierlifesciences=premierlifesciences.com
app.entity-mail.domains.unitedpharmatechnologies=unitedpharmatechnologies.com
app.entity-mail.domains.kennedysoft=kennedysoft.com
app.entity-mail.domains.shoolin-inc=shoolin-inc.com
app.entity-mail.domains.lumininc=lumininc.com
app.entity-mail.domains.lumin-innovation=lumin-innovations.com
app.entity-mail.domains.kkrconsulting=kkrconsulting.com
app.entity-mail.domains.ubitz=ubitz.ai

# Allowed email domains
app.allowed-email-domains=intellectt.com,novozen.com,revereit.com,premierlifesciences.com,unitedpharmatechnologies.com,kennedysoft.com,shoolin-inc.com,lumininc.com,lumin-innovations.com,kkrconsulting.com,ubitz.ai

# Entity mailbox routing
app.entity-mail.mailbox-routing=true
app.entity-mail.super-admin-address=

app.entity-mail.mailboxes.hr=hr
app.entity-mail.mailboxes.payroll=payroll
app.entity-mail.mailboxes.accounts=accounts
app.entity-mail.mailboxes.contracts=contracts
app.entity-mail.mailboxes.super-admin=superadmin
