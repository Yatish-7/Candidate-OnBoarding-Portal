spring.application.name=OneIntellectt
server.port=5000

# Secrets (DB password, JWT key, mail password) live in OneIntellectt/secrets.properties,
# which is never committed, or in environment variables. Values there override this file.
spring.config.import=optional:file:./secrets.properties

# Behind a reverse proxy (nginx), use the client's real IP from X-Forwarded-For for
# sign-in rate limiting. Only trusted from private/local addresses, so it can't be spoofed
# from the internet.
server.forward-headers-strategy=native

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/Intellectt
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool: up to 30 DB connections shared by all requests (default is 10).
# PostgreSQL allows 100 by default — keep (pool size x app instances) below that.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=5
# Fail a request after 10 s waiting for a connection instead of hanging for 30 s
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
# Printing every SQL statement is a big slowdown under load (2M lines in a 4-min
# 1000-user test). Off by default; set SHOW_SQL=true when you need it for debugging.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Off: a DB connection is released as soon as the query work is done, not held while
# the (sometimes large) JSON response is written. Under a 1000-user load test this was
# the difference between an exhausted connection pool and a healthy one.
spring.jpa.open-in-view=false

# Audit log (Hibernate Envers): every audited table gets a "<table>_aud" history
# table; audit_revisions records who/when for each change. Keep the full row
# on deletes so a deleted record's last state is preserved.
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# ---------------------------------------------------------------------------
# JWT configuration
# The signing key comes from secrets.properties or APP_JWT_SECRET (startup fails
# if it is missing or shorter than 32 characters).
# ---------------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Key that encrypts candidate SSNs at rest (FieldCipher). From secrets.properties or
# APP_CRYPTO_KEY; startup fails without it.
app.crypto.key=${APP_CRYPTO_KEY:}

# ---------------------------------------------------------------------------
# Sessions (SessionServiceImpl): one live session per user, checked on every
# request. Signed out after this many minutes with no activity (the browser warns
# a minute before). The hard limit is app.jwt.expiration-ms above.
# ---------------------------------------------------------------------------
app.session.idle-timeout-minutes=${SESSION_IDLE_TIMEOUT_MINUTES:30}

# ---------------------------------------------------------------------------
# CORS: browser origins allowed to call the API (the React/Vite frontend)
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ---------------------------------------------------------------------------
# Password reset: the frontend base URL used to build the reset link in the
# email, and how long a reset token stays valid.
# ---------------------------------------------------------------------------
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.reset.token-ttl-minutes=${RESET_TOKEN_TTL_MINUTES:60}

# ---------------------------------------------------------------------------
# Initial Super Admin (seeded on first startup of an empty database; change the
# password after login). Its password comes from secrets.properties or SUPERADMIN_PASSWORD.
# ---------------------------------------------------------------------------
app.superadmin.name=Super Admin
app.superadmin.email=${SUPERADMIN_EMAIL:admin@intellectt.com}
app.superadmin.password=${SUPERADMIN_PASSWORD:}

# ---------------------------------------------------------------------------
# Email (SMTP) configuration
# Username/password come from secrets.properties or MAIL_USERNAME / MAIL_PASSWORD.
# Example for Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587,
#   MAIL_USERNAME=<you>@gmail.com, MAIL_PASSWORD=<16-char app password>.
# If MAIL_HOST is blank, notifications are logged instead of sent.
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Never fall back to plain text, and check the mail server's certificate name (stops a downgrade / impersonation)
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
app.mail.from=${MAIL_FROM:${spring.mail.username}}

# ---------------------------------------------------------------------------
# Entity-based email routing (EntityMailProperties / EmailServiceImpl)
# Once the Sales Lead approves, workflow emails go to role mailboxes at the
# candidate's Internal Entity domain:  <mailbox>@<domain>
#   e.g. entity "novozen" -> hr@novozen.com, payroll@novozen.com, ...
# Keys under "domains" must match the Internal Entity values exactly (lowercase).
# If a candidate has no entity, or one not listed here, emails fall back to the
# portal users who hold those roles.
# ---------------------------------------------------------------------------
app.entity-mail.domains.novozen=novozen.com
app.entity-mail.domains.revereit=revereit.com
app.entity-mail.domains.premierlifesciences=premierlifesciences.com
app.entity-mail.domains.unitedpharmatechnologies=unitedpharmatechnologies.com
app.entity-mail.domains.kennedysoft=kennedysoft.com
app.entity-mail.domains.shoolin-inc=shoolin-inc.com
app.entity-mail.domains.lumininc=lumininc.com
app.entity-mail.domains.lumin-innovation=lumin-innovations.com
app.entity-mail.domains.kkrconsulting=kkrconsulting.com
app.entity-mail.domains.ubitz=ubitz.ai
# The mailbox (part before the @) used for each role at every entity domain
# (keys are the role names in lowercase with hyphens, e.g. super-admin)
# Only these email domains can have a portal account or sign in (comma separated, no "@").
app.allowed-email-domains=intellectt.com,novozen.com,revereit.com,premierlifesciences.com,unitedpharmatechnologies.com,kennedysoft.com,shoolin-inc.com,lumininc.com,lumin-innovations.com,kkrconsulting.com,ubitz.ai

# --- Testing switches (normally off) ---------------------------------------
# true  = emails go to the role mailboxes at the Placement Entity domain (hr@novozen.com ...), and
#         also at the payroll company's domain when that is a different entity.   <- normal
# false = TESTING: ignore those mailboxes; HR, Contracts, Payroll and Accounts emails go to the
#         portal users who hold those roles (the emails on their user accounts).
app.entity-mail.mailbox-routing=true
# Optional: send every "copy the Super Admin" email to this one address instead of
# superadmin@<domain>. Blank = off (normal).
app.entity-mail.super-admin-address=
# ---------------------------------------------------------------------------
app.entity-mail.mailboxes.hr=hr
app.entity-mail.mailboxes.payroll=payroll
app.entity-mail.mailboxes.accounts=accounts
app.entity-mail.mailboxes.contracts=contracts
app.entity-mail.mailboxes.super-admin=superadmin
